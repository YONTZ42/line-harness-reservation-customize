name: Migrate D1

# Required GitHub Secrets:
# - CLOUDFLARE_API_TOKEN
#
# Optional GitHub Variables:
# - CLOUDFLARE_ACCOUNT_ID        can be a Secret or Variable
# - CLOUDFLARE_D1_DATABASE_ID    can be a Secret or Variable
# - CLOUDFLARE_D1_DATABASE_NAME


on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment to migrate'
        required: true
        type: string
        default: production-client-filmtravel
      migration_file:
        description: SQL file to execute. Use packages/db/schema.sql for first setup, or a file under packages/db/migrations.
        required: true
        default: packages/db/schema.sql
      database_name:
        description: Remote D1 database name
        required: false
      confirm_remote:
        description: I understand this executes against the remote D1 database
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: d1-migration-${{ inputs.environment || vars.DEFAULT_DEPLOY_ENVIRONMENT || 'production-client-filmtravel' }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || vars.DEFAULT_DEPLOY_ENVIRONMENT || 'production-client-filmtravel' }}
    steps:
      - uses: actions/checkout@v4

      - name: Require remote confirmation
        if: ${{ inputs.confirm_remote != true }}
        run: |
          echo "Set confirm_remote=true to run a migration against the remote D1 database."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare Wrangler D1 config
        working-directory: apps/worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID || vars.CLOUDFLARE_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ inputs.database_name || vars.CLOUDFLARE_D1_DATABASE_NAME }}
          MIGRATION_FILE: ${{ inputs.migration_file }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const accountId = process.env.CF_ACCOUNT_ID?.trim();
          const databaseId = process.env.CF_D1_DATABASE_ID?.trim();
          const databaseName = process.env.CF_D1_DATABASE_NAME?.trim();
          const migrationFile = process.env.MIGRATION_FILE?.trim();

          if (!accountId) throw new Error('CF_ACCOUNT_ID is required');
          if (!databaseId) throw new Error('CF_D1_DATABASE_ID is required');
          if (!databaseName) throw new Error('CF_D1_DATABASE_NAME is required');
          if (!migrationFile) throw new Error('migration_file is required');
          const isSchemaFile = migrationFile === 'packages/db/schema.sql';
          const isMigrationFile = migrationFile.startsWith('packages/db/migrations/');
          if ((!isSchemaFile && !isMigrationFile) || !migrationFile.endsWith('.sql')) {
            throw new Error('migration_file must be packages/db/schema.sql or a .sql file under packages/db/migrations/');
          }

          const repoRoot = path.resolve(process.cwd(), '../..');
          const absoluteMigrationFile = path.resolve(repoRoot, migrationFile);
          const migrationsDir = path.resolve(repoRoot, 'packages/db/migrations');
          const schemaFile = path.resolve(repoRoot, 'packages/db/schema.sql');
          if (isSchemaFile) {
            if (absoluteMigrationFile !== schemaFile) {
              throw new Error('migration_file must resolve to packages/db/schema.sql');
            }
          } else if (!absoluteMigrationFile.startsWith(migrationsDir + path.sep)) {
            throw new Error('migration_file must stay inside packages/db/migrations/');
          }
          if (!fs.existsSync(absoluteMigrationFile)) {
            throw new Error(`Migration file not found: ${migrationFile}`);
          }

          fs.writeFileSync('.wrangler-d1-ci.json', JSON.stringify({
            name: 'line-harness-d1-migration',
            account_id: accountId,
            compatibility_date: '2024-12-01',
            d1_databases: [{
              binding: 'DB',
              database_name: databaseName,
              database_id: databaseId,
            }],
          }, null, 2));

          fs.writeFileSync('.migration-file', path.relative(process.cwd(), absoluteMigrationFile).replaceAll('\\', '/'));
          fs.writeFileSync('.database-name', databaseName);
          NODE

      - name: Export D1 backup before migration
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          db="$(cat .database-name)"
          mkdir -p ../../backups/d1
          timestamp="$(date -u +'%Y%m%dT%H%M%SZ')"
          safe_db="$(printf '%s' "$db" | tr -cd '[:alnum:]_.-')"
          backup_file="../../backups/d1/${safe_db}-${timestamp}.sql"
          echo "Exporting remote D1 backup to ${backup_file}"
          npx wrangler@4 d1 export "$db" --remote --config .wrangler-d1-ci.json --output "$backup_file"
          echo "backup_file=${backup_file}" >> "$GITHUB_ENV"

      - name: Upload D1 backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: d1-backup-${{ inputs.database_name || vars.CLOUDFLARE_D1_DATABASE_NAME }}-${{ github.run_id }}
          path: backups/d1/*.sql
          if-no-files-found: error
          retention-days: 14

      - name: Apply migration
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          db="$(cat .database-name)"
          migration_file="$(cat .migration-file)"
          npx wrangler@4 d1 execute "$db" --remote --config .wrangler-d1-ci.json --file "$migration_file"
