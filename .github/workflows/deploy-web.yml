name: Deploy Web

# Deploys apps/web as a static Next.js export to Cloudflare Pages.
#
# Required GitHub Secrets:
# - CLOUDFLARE_API_TOKEN
#
# Required GitHub Variables or Secrets:
# - CLOUDFLARE_ACCOUNT_ID
#
# Required GitHub Variables:
# - CLOUDFLARE_PAGES_PROJECT_NAME   optional, default: line-harness-reservation-web
# - NEXT_PUBLIC_API_URL             example: https://line-harness-reservation.example.workers.dev
#
# Cloudflare Pages project is created automatically when missing.
# Project-level settings beyond the production branch are not managed here.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'GitHub Environment to deploy'
        required: true
        type: string
        default: production-client-filmtravel
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'packages/sdk/**'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-web.yml'



jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'workflow_dispatch' && inputs.environment || vars.DEFAULT_DEPLOY_ENVIRONMENT || 'production-client-filmtravel' }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared build
      - run: pnpm --filter @line-harness/sdk build

      - name: Validate deployment settings
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'line-harness-reservation-web' }}
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.WORKER_URL }}
        run: |
          node <<'NODE'
          const required = [
            'CLOUDFLARE_ACCOUNT_ID',
            'NEXT_PUBLIC_API_URL',
          ];

          for (const key of required) {
            if (!process.env[key]?.trim()) {
              throw new Error(`${key} is required`);
            }
          }
          NODE

      - name: Build web
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL || vars.WORKER_URL }}

      - name: Ensure Cloudflare Pages project exists
        run: |
          set +e
          output="$(pnpm exec wrangler pages project create "$CLOUDFLARE_PAGES_PROJECT_NAME" --production-branch "$PAGES_PRODUCTION_BRANCH" 2>&1)"
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          if echo "$output" | grep -qi "already exists"; then
            echo "Cloudflare Pages project already exists: $CLOUDFLARE_PAGES_PROJECT_NAME"
            exit 0
          fi
          exit "$status"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'line-harness-reservation-web' }}
          PAGES_PRODUCTION_BRANCH: ${{ vars.PAGES_PRODUCTION_BRANCH || 'main' }}

      - name: Deploy to Cloudflare Pages
        run: pnpm exec wrangler pages deploy apps/web/out --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" --branch "$GITHUB_REF_NAME"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME || 'line-harness-reservation-web' }}
